spring.application.name=voyagepilot-api
server.port=8080

# MongoDB Configuration
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/voyagepilot}
spring.data.mongodb.database=voyagepilot
spring.data.mongodb.auto-index-creation=true

# AI Provider Configuration (gemini or fallback)
voyagepilot.ai.provider=${AI_PROVIDER:fallback}
voyagepilot.ai.gemini.api-key=${GEMINI_API_KEY:}
voyagepilot.ai.gemini.model=${GEMINI_MODEL:gemini-2.0-flash}

# CORS
voyagepilot.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

# Logging
logging.level.com.voyagepilot=INFO
logging.level.org.springframework.data.mongodb=WARN
